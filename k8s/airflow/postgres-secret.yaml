apiVersion: v1
kind: Secret
metadata:
  name: banvic-postgres-connection
  namespace: banvic
type: Opaque
# Usado apenas pelo Pod do Meltano (ambiente k8s do meltano.yml).
stringData:
  TARGET_POSTGRES_SQLALCHEMY_URL: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
