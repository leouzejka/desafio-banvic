apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  namespace: banvic
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow-dag-processor
  template:
    metadata:
      labels:
        app: airflow-dag-processor
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dag-processor
          image: banvic-airflow:3.3.1
          imagePullPolicy: IfNotPresent
          command:
            - airflow
            - dag-processor

          envFrom:
            - configMapRef:
                name: airflow-config
            - secretRef:
                name: airflow-database

          livenessProbe:
            exec:
              command:
                - airflow
                - jobs
                - check
                - --job-type
                - DagProcessorJob
                - --local
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
